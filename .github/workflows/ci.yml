name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck · lint · unit tests · package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run bench
      - run: npm run package
      - name: No eval / remote code in the build
        run: |
          if grep -rlE '\beval\(|new Function\(' dist; then echo "string evaluation found in dist"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: extension-zip
          path: |
            release/*.zip
            release/*.sha256

  e2e:
    name: E2E (Chrome for Testing, mocked sites)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fonts (Korean PDF text) and pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk poppler-utils
      - run: npm run e2e:install-chrome
      - run: npm run test:e2e
        env:
          CI: 'true'
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: |
            test-output/e2e/
            bench-results/e2e-chrome-1m.json
